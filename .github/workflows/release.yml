name: Build and Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            ext: ""
          - os: macos-latest
            goos: darwin
            goarch: amd64
            ext: ""
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"

      - name: Set version vars
        id: vars
        shell: bash
        run: |
          echo "version=${GITHUB_REF_NAME:-dev}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build \
            -ldflags="-s -w \
            -X main.version=${{ steps.vars.outputs.version }} \
            -X main.commit=${{ steps.vars.outputs.commit }} \
            -X main.date=${{ steps.vars.outputs.date }}" \
            -o dist/sax-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} .
          go build \
            -ldflags="-s -w" \
            -o dist/ss-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/ss

      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect binaries
        run: |
          mkdir -p release
          find artifacts -type f \( -name 'sax-*' -o -name 'ss-*' \) -exec cp {} release/ \;
          chmod +x release/sax-linux-* release/sax-darwin-* release/ss-linux-* release/ss-darwin-* || true
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: SAX ${{ github.ref_name }}
          body: |
            Release ${{ github.ref_name }}

            Commit: ${{ github.sha }}
          files: release/*
          generate_release_notes: true
